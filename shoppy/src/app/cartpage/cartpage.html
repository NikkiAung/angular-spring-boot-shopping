<h4>Your Cart Items</h4>
<table class="table table-bordered">
  <thead>
    <tr>
      <th scope="col">No</th>
      <th scope="col">Name</th>
      <th scope="col">Images</th>
      <th scope="col">Price</th>
      <th scope="col">Count</th>
      <th scope="col">Total</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let product of products; index as i">
      <td>{{ i + 1 }}</td>
      <td>{{ product.name }}</td>
      <td><img *ngFor="let image of product.images" src="{{ image }}" alt="" width="50px" /></td>
      <td>{{ product.price }}</td>
      <td>
        <button class="btn btn-sm btn-warning" (click)="reduceQuantity(product)">
          <i class="fa fa-minus"></i>
        </button>
        {{ product.count }}
        <button class="btn btn-sm btn-warning" (click)="increaseQuantity(product)">
          <i class="fa fa-minus"></i>
        </button>
      </td>
      <td>{{ product.count * product.price }}</td>
    </tr>
  </tbody>

  <tbody>
    <tr>
      <td colspan="5" class="text-end">Grand Total</td>
      <td>{{ getTotalPrice() }}</td>
    </tr>

    <tr>
      <td colspan="5" class="text-end">Check Out</td>
      <td><button class="btn btn-sm btn-success" (click)="checkOut()">Check Out</button></td>
    </tr>
  </tbody>
</table>
